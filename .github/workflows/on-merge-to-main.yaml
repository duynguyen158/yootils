name: Publish on PR merge

on:
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  publish:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      # (see: https://docs.pypi.org/trusted-publishers/using-a-publisher/)
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.7"

      - name: Check if version is bumped
        id: check_version
        continue-on-error: true
        run: |
          eval $(uvx bumpver show --environ)
          if git tag -l | grep -q "^$PEP440_VERSION$"; then
            echo "VERSION_BUMPED=false" >> $GITHUB_OUTPUT
            echo "Version $PEP440_VERSION already exists. Skipping publish."
          else
            echo "VERSION_BUMPED=true" >> $GITHUB_OUTPUT
            echo "version=$PEP440_VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Save version status
        if: always()
        run: |
          echo "${{ steps.check_version.outputs.VERSION_BUMPED }}" > version_status.txt
          echo "${{ steps.check_version.outputs.version }}" > version.txt

      - name: Upload version status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: version-info
          path: |
            version_status.txt
            version.txt

      - name: Build package
        if: steps.check_version.outputs.VERSION_BUMPED == 'true'
        run: uv build

      - name: Publish package to PyPI
        if: steps.check_version.outputs.VERSION_BUMPED == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

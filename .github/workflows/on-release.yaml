name: Publish to PyPI
on:
  workflow_run:
    workflows: ["Create release"]
    types:
      - completed

jobs:
  publish-package:
    name: Publish package to PyPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.7"
      - name: Build package
        run: uv build
      - name: Publish to PyPI
        # No PyPI token needed since GitHub is added as trusted publisher on PyPI
        run: uv publish